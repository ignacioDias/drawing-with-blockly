services:
  postgres:
    image: postgres:16-alpine
    container_name: drawing-with-blockly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drawing_with_blockly}
      POSTGRES_USER: ${POSTGRES_USER:-drawing_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawing_app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drawing_app} -d ${POSTGRES_DB:-drawing_with_blockly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
