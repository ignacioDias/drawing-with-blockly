<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Drawing Workspace</title>
  </head>
  <body>
    <div class="top-controls" role="toolbar" aria-label="App controls">
      <a class="back-link" href="index.html">Back to levels</a>
      <label class="control-group" for="language-select">
        <span>Language</span>
        <select id="language-select">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </label>
      <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
      <a id="profile-link" class="auth-link" href="profile.html" hidden>Profile</a>
      <a id="auth-link" class="auth-link" href="login.html">Log in</a>
    </div>
    <div id="pageContainer">
      <div id="page-title">Make a picture with blocks</div>
      <div id="outputPane">
        <pre id="generatedCode"><code></code></pre>
        <div id="output"></div>
      </div>
      <div id="blocklyDiv"></div>
      <div id="run-controls">
        <button id="run-button">Start drawing!</button>
        <button id="clear-board-button">Clear board</button>
      </div>
      <div id="boards-container">
        <section class="board-panel">
          <h2 id="current-board-label">Current board</h2>
          <p id="current-board-subtitle">Your drawing appears here.</p>
          <div id="board-container"></div>
        </section>
        <section class="board-panel">
          <h2 id="target-board-label">Target board</h2>
          <p id="target-board-subtitle">Recreate this drawing.</p>
          <div id="target-board-container"></div>
        </section>
      </div>
    </div>
  </body>
</html>
