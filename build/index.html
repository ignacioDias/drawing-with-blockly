<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Choose a Level</title>
  <script defer src="main.js"></script></head>
  <body>
    <div class="top-controls" role="toolbar" aria-label="App controls">
      <label class="control-group" for="language-select">
        <span>Language</span>
        <select id="language-select">
          <option value="en">English</option>
          <option value="es">Spanish</option>
        </select>
      </label>
      <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
      <a id="auth-link" class="auth-link" href="login.html">Log in</a>
    </div>
    <main class="home-shell">
      <header class="home-header">
        <h1 id="home-title">Choose a Drawing Level</h1>
        <p id="home-subtitle">Select a level and open the Blockly workspace.</p>
      </header>
      <section id="level-grid" class="level-grid" aria-label="Available levels"></section>
      <p id="level-status" class="level-status" role="status"></p>
    </main>
  </body>
</html>
