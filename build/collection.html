<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Collection</title>
  <script defer src="collection.js"></script></head>
  <body>
    <div class="top-controls" role="toolbar" aria-label="App controls">
      <a class="back-link" href="index.html">Back to collections</a>
      <label class="control-group" for="language-select">
        <span>Language</span>
        <select id="language-select">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </label>
      <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
      <a id="auth-link" class="auth-link" href="login.html">Log in</a>
    </div>
    <main class="home-shell collection-page">
      <header class="home-header">
        <h1 id="collection-title">Collection</h1>
        <p id="collection-description"></p>
      </header>
      <section id="level-grid" class="level-grid" aria-label="Collection levels"></section>
      <p id="level-status" class="level-status" role="status"></p>
    </main>
  </body>
</html>
